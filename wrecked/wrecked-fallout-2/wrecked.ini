; Wrecked Fallout 2 by breakVanilla: explosions that break things.
[wrecked]
; 0 turns the whole mod off: nothing breaks, and damage kept in saves is neither shown nor saved again.
enabled=1
; What explosions can break: walls, and scenery without a script.
walls=1
scenery=1
; Craters and scorch marks on the ground.
craters=1
; Screen shake and a flash of light.
shake=1
flash=1
; X calls a beam down from orbit at the mouse cursor: it aims for a second, then burns for two seconds, follows the cursor and sets the ground off as it goes.
test_key=1
; 0: X sets off a plain explosion at the cursor instead.
beam=1
; G drops a meteor at the mouse cursor: it streaks in for under two seconds and breaks more, and wider, than any explosion, hurting everyone around.
meteor=1
; 1: nobody turns on you and no combat starts; your shots, throws and explosions happen at once and still hurt and kill.
peaceful=0
; Damage it takes to break a wall or a piece of scenery; bigger art takes more.
wall_strength=30
scenery_strength=10
; Flying debris, percent of the usual amount.
debris=100
; Most debris pieces and craters kept per map.
max_decals=3000
; Maps where nothing breaks, comma separated, for example: ARTEMPLE,VAULT13
blocked_maps=
